<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayumi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+JP:wght@200;300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg:       #08080d;
    --bg2:      #0e0e16;
    --ink:      #e4dfd8;
    --ink-dim:  rgba(228,223,216,0.35);
    --ink-faint:rgba(228,223,216,0.12);
    --rose:     #c9637a;
    --rose-dim: rgba(201,99,122,0.18);
    --silver:   rgba(228,223,216,0.08);
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Cormorant Garamond', Georgia, serif;
    overflow-x: hidden;
    min-height: 100vh;
  }

  canvas#rain {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  .wrap { position: relative; z-index: 1; }

  /* ── Hero ── */
  .hero {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    text-align: center;
    padding: 2rem;
  }

  .hero-kanji {
    font-family: 'Noto Serif JP', serif;
    font-weight: 200;
    font-size: clamp(4rem, 18vw, 14rem);
    color: var(--ink-faint);
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -54%);
    letter-spacing: 0.05em;
    user-select: none;
    pointer-events: none;
    animation: breathe 7s ease-in-out infinite;
  }

  .hero-name {
    font-size: clamp(2.8rem, 10vw, 8rem);
    font-weight: 300;
    letter-spacing: 0.22em;
    color: var(--ink);
    position: relative;
    opacity: 0;
    animation: fadeUp 1.6s cubic-bezier(.16,1,.3,1) 0.5s forwards;
  }

  .hero-name span {
    color: var(--rose);
  }

  .hero-line {
    margin-top: 1.8rem;
    width: 48px;
    height: 1px;
    background: var(--rose);
    position: relative;
    opacity: 0;
    animation: expandLine 1s ease 1.4s forwards;
    transform-origin: left;
    transform: scaleX(0);
  }

  .hero-sub {
    margin-top: 1.4rem;
    font-size: clamp(0.75rem, 2vw, 0.9rem);
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: var(--ink-dim);
    font-weight: 300;
    opacity: 0;
    animation: fadeUp 1s ease 1.8s forwards;
  }

  /* ── Veil divider ── */
  .veil {
    height: 1px;
    background: linear-gradient(to right, transparent, var(--rose-dim), rgba(201,99,122,0.35), var(--rose-dim), transparent);
    margin: 0 auto;
    width: 80%;
  }

  /* ── Quote section ── */
  .quote-section {
    padding: 8rem 2rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .quote-inner {
    max-width: 560px;
    text-align: center;
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 1s ease, transform 1s cubic-bezier(.16,1,.3,1);
  }

  .quote-inner.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .quote-mark {
    font-size: 5rem;
    line-height: 0.5;
    color: var(--rose);
    opacity: 0.5;
    font-style: italic;
    display: block;
    margin-bottom: 1.5rem;
  }

  .quote-text {
    font-size: clamp(1.2rem, 3vw, 1.7rem);
    font-style: italic;
    font-weight: 300;
    line-height: 1.65;
    color: var(--ink);
    letter-spacing: 0.02em;
  }

  /* ── Letter section ── */
  .letter-section {
    padding: 6rem 2rem 10rem;
    display: flex;
    justify-content: center;
  }

  .letter {
    max-width: 480px;
    width: 100%;
    border: 1px solid var(--ink-faint);
    border-top: 1px solid rgba(201,99,122,0.3);
    padding: 3.5rem 3rem;
    position: relative;
    opacity: 0;
    transform: translateY(28px);
    transition: opacity 1.1s ease, transform 1.1s cubic-bezier(.16,1,.3,1);
  }

  .letter.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .letter::before {
    content: '';
    position: absolute;
    top: -1px; left: 0;
    width: 60px;
    height: 1px;
    background: transparent;
  }

  .letter-eyebrow {
    font-size: 0.7rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--rose);
    margin-bottom: 2rem;
    display: block;
  }

  .letter-body {
    font-size: clamp(1rem, 2.5vw, 1.18rem);
    line-height: 2;
    color: var(--ink-dim);
    font-weight: 300;
  }

  .letter-body strong {
    color: var(--ink);
    font-weight: 400;
  }

  .letter-sign {
    margin-top: 2.5rem;
    font-style: italic;
    color: var(--ink-dim);
    font-size: 1rem;
  }

  /* ── Name repeat footer ── */
  .name-footer {
    padding: 5rem 2rem 3rem;
    text-align: center;
    border-top: 1px solid var(--ink-faint);
    position: relative;
    overflow: hidden;
  }

  .name-bg {
    font-family: 'Noto Serif JP', serif;
    font-weight: 200;
    font-size: clamp(5rem, 22vw, 18rem);
    color: var(--ink-faint);
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
    opacity: 0.4;
  }

  .name-footer p {
    position: relative;
    font-size: 0.7rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: rgba(228,223,216,0.2);
    padding-bottom: 2rem;
  }

  /* ── Keyframes ── */
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
    from { opacity: 0; transform: translateY(28px); }
  }

  @keyframes expandLine {
    to { opacity: 1; transform: scaleX(1); }
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.06; transform: translate(-50%,-54%) scale(1); }
    50%       { opacity: 0.1;  transform: translate(-50%,-54%) scale(1.015); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<canvas id="rain"></canvas>

<div class="wrap">

  <section class="hero">
    <div class="hero-kanji" aria-hidden="true">歩</div>
    <h1 class="hero-name">AY<span>U</span>MI</h1>
    <div class="hero-line"></div>
    <p class="hero-sub">歩み &nbsp;·&nbsp; journey</p>
  </section>

  <div class="veil"></div>

  <section class="quote-section">
    <div class="quote-inner reveal">
      <span class="quote-mark" aria-hidden="true">"</span>
      <p class="quote-text">Some people arrive and the world is never quite the same.</p>
    </div>
  </section>

  <div class="veil"></div>

  <section class="letter-section">
    <div class="letter reveal">
      <span class="letter-eyebrow">A note</span>
      <p class="letter-body">
        This page exists for one reason —<br>
        to say that <strong>Ayumi</strong> is someone worth celebrating.<br><br>
        Quietly or loudly, in the dark or in the light,<br>
        she leaves a mark that doesn't fade.
      </p>
      <p class="letter-sign">— a fan</p>
    </div>
  </section>

  <footer class="name-footer">
    <div class="name-bg" aria-hidden="true">歩</div>
    <p>ayumi &nbsp;·&nbsp; always</p>
  </footer>

</div>

<script>
/* ── Rain canvas ── */
const canvas = document.getElementById('rain');
const ctx = canvas.getContext('2d');
let drops = [];

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  initDrops();
}

function initDrops() {
  drops = Array.from({ length: 80 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    len: 10 + Math.random() * 25,
    speed: 0.4 + Math.random() * 0.8,
    alpha: 0.02 + Math.random() * 0.07,
    width: 0.3 + Math.random() * 0.5,
  }));
}

function drawRain() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (const d of drops) {
    ctx.beginPath();
    ctx.moveTo(d.x, d.y);
    ctx.lineTo(d.x - d.len * 0.1, d.y + d.len);
    ctx.strokeStyle = `rgba(201,99,122,${d.alpha})`;
    ctx.lineWidth = d.width;
    ctx.stroke();
    d.y += d.speed;
    d.x -= d.speed * 0.1;
    if (d.y > canvas.height + d.len) {
      d.y = -d.len;
      d.x = Math.random() * canvas.width;
    }
  }
  requestAnimationFrame(drawRain);
}

window.addEventListener('resize', resize);
resize();
drawRain();

/* ── Scroll reveal ── */
const reveals = document.querySelectorAll('.reveal');
const obs = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
}, { threshold: 0.2 });
reveals.forEach(el => obs.observe(el));
</script>
</body>
</html>
